# Laid over core's deploy/docker-compose.yml (e2e/stack.sh): core learns the
# plugin's key, and the plugin image joins the stack. The browser reaches web
# on :8080 and the plugin on :3399.
services:
  api:
    environment:
      CORE_PLUGIN_KEYS: frontline:${PLUGIN_SECRET:?set PLUGIN_SECRET}

  # The manifest's api.url is PUBLIC_URL, localhost:3399, where the browser and
  # the specs reach the plugin. Core posts events and jobs there from its own
  # container, so this proxy, in core's network namespace, forwards its
  # localhost:3399 to the plugin.
  core-to-plugin:
    image: alpine/socat:1.8.0.3
    network_mode: service:api
    command: tcp-listen:3399,fork,reuseaddr tcp-connect:frontline:3399
    depends_on:
      api: { condition: service_healthy }

  frontline:
    image: ${FRONTLINE_IMAGE:-frontline-plugin:ci}
    environment:
      # e2e/stack.sh creates the role and passes its password.
      DATA_URL: postgres://erxes_plugin_frontline:${PLUGIN_DATA_PASSWORD:-}@postgres:5432/erxes
      CORE_URL: http://api:3400
      PLUGIN_SECRET: ${PLUGIN_SECRET:?set PLUGIN_SECRET}
      # A throwaway stack with synthetic data: a fixed key is enough.
      SECRETS_KEY: ZTJlLXNlY3JldHMta2V5LTMyLWJ5dGVzLWxvbmchISE=
      PUBLIC_URL: http://localhost:3399
      CORE_UI_URL: http://localhost:8080
    ports:
      - '3399:3399'
    depends_on:
      api: { condition: service_healthy }
      core-to-plugin: { condition: service_started }
