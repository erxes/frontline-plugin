name: CI

on:
  push:
    branches: [postgre]
  pull_request:
    # labeled: the budget-increase label reruns the budget check.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec vp run check

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATA_TEST_URL: postgres://ci:ci-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec vp run test
      # What lets queries rely on withOrg() instead of org filters (tools/check-rls.sql).
      - run: pnpm check:rls

  # One image build feeds the budgets, the scan and the plugin in web: core's
  # released images plus this one (e2e/stack.sh), in Chromium with axe on every page.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm image
        env:
          VERSION: ${{ github.sha }}
      - name: Start core and the plugin in the background
        run: (pnpm e2e:stack up > "$RUNNER_TEMP/stack.log" 2>&1; echo $? > "$RUNNER_TEMP/stack.status") &
      - name: Base branch budgets
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p .scratch
          git fetch --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:budgets.json > .scratch/base-budgets.json || rm -f .scratch/base-budgets.json
      - run: pnpm budgets --base .scratch/base-budgets.json ${{ contains(github.event.pull_request.labels.*.name, 'budget-increase') && '--allow-increase' || '' }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: frontline-plugin:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Chromium (headless shell) and its system libraries
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Wait for the stack
        run: |
          for _ in $(seq 150); do [ -f "$RUNNER_TEMP/stack.status" ] && break; sleep 2; done
          cat "$RUNNER_TEMP/stack.log"
          exit "$(cat "$RUNNER_TEMP/stack.status")"
      - name: The plugin in web, light and dark, with axe
        run: pnpm e2e --reporter=github,list
      - name: Keep the tested image for the push
        if: github.event_name == 'push'
        run: docker save frontline-plugin:ci | gzip > frontline-plugin.tar.gz
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontline-image
          path: frontline-plugin.tar.gz
          retention-days: 3
      - name: Traces and screenshots of failed specs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: e2e/test-results/
          retention-days: 14
      - name: Stack logs
        if: failure()
        run: pnpm e2e:stack logs

  # The one status branch protection requires: green only when every job above is.
  required:
    name: Check
    if: always()
    needs: [check, test, build]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "A required job ended $result."; exit 1; }
          done

  # The image the build job scanned and ran the flows on, as docker.io/erxes/frontline-plugin.
  push:
    name: Push the image to Docker Hub
    needs: required
    if: github.event_name == 'push' && github.ref == 'refs/heads/postgre'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontline-image
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag and push sha-<12 chars> and postgre
        run: |
          gunzip -c frontline-plugin.tar.gz | docker load
          image=docker.io/erxes/frontline-plugin
          for tag in "sha-${GITHUB_SHA::12}" postgre; do
            docker tag frontline-plugin:ci "$image:$tag"
            docker push "$image:$tag"
          done
