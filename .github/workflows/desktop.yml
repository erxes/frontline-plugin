name: Desktop

# Builds the desktop app's installers on macOS, Windows and Linux. A desktop-v<version> tag
# publishes them as a GitHub release; a pull request that changes desktop/, or a manual run,
# keeps them as the run's artifacts. They aren't signed yet, so macOS and Windows warn on first
# open.
on:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions: {}

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      # No certificate yet: electron-builder skips signing instead of looking for one.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: The tag names desktop/package.json's version
        if: github.ref_type == 'tag'
        shell: bash
        run: test "$GITHUB_REF_NAME" = "desktop-v$(node -p "require('./desktop/package.json').version")"
      - run: pnpm --filter @frontline/desktop dist --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.AppImage
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Publish the installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" release/* --repo "$REPO" --title "Frontline desktop ${TAG#desktop-v}" --notes-file - <<'NOTES'
          The installers aren't signed yet.

          - macOS: open the dmg and drag Frontline to Applications. The first time, right-click Frontline and pick Open, or run `xattr -dr com.apple.quarantine /Applications/Frontline.app`.
          - Windows: when SmartScreen stops the installer, pick More info, then Run anyway.
          - Linux: `chmod +x` the AppImage and run it.
          NOTES
