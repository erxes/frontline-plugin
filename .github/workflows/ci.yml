name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled: the budget-increase label reruns the budget check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The merge queue tests each pull request on top of main and the ones queued ahead of it.
  # It runs as a push does: the full e2e, and budgets against their ceilings, since the pull
  # request's own run already compared them with its base.
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job waits for one of the org's shared runners, so the checks and the tests share one:
# together they still end before the build and the e2e shards do.
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATA_TEST_URL: postgres://ci:ci-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; the first parent is the base branch.
          fetch-depth: 2
      - uses: ./.github/actions/setup
      - run: pnpm exec vp run check
      - run: pnpm exec vp run test
      # What lets queries rely on withOrg() instead of org filters (tools/check-rls.sql).
      - run: pnpm check:rls
      # This change's sizes against its ceilings, and against the base branch built beside it.
      - name: Budgets
        env:
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'budget-increase') }}
        run: |
          pnpm build
          args=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
            (cd "$RUNNER_TEMP/base" && pnpm install --frozen-lockfile --prefer-offline && pnpm build)
            args+=(--base "$RUNNER_TEMP/base")
          fi
          [ "$LABELED" = true ] && args+=(--allow-increase)
          pnpm budgets "${args[@]}"

  # One image build feeds the scan, the e2e shards and the push. A pull request that changes
  # only Markdown builds no image and runs no e2e; one that changes no dependency, Dockerfile or
  # workflow skips the scan, which main still runs on every push.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      app: ${{ steps.changes.outputs.app }}
      deps: ${{ steps.changes.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; the first parent is the base branch.
          fetch-depth: 2
      - name: What the pull request changes
        id: changes
        run: |
          app=true deps=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            grep -qv '\.md$' <<< "$files" || app=false
            grep -qE '^\.github/|(^|/)(Dockerfile|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.node-version)$' <<< "$files" || deps=false
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.app == 'true'
        uses: ./.github/actions/setup
      - if: steps.changes.outputs.app == 'true'
        run: pnpm image
        env:
          VERSION: ${{ github.sha }}
      # gzip -1 and no zip on top: the upload and the shards' download wait on it.
      - if: steps.changes.outputs.app == 'true'
        run: docker save frontline-plugin:ci | gzip -1 > frontline-plugin.tar.gz
      - if: steps.changes.outputs.app == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontline-image
          path: frontline-plugin.tar.gz
          compression-level: 0
          retention-days: 3

  scan:
    needs: build
    if: needs.build.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontline-image
      - run: gunzip -c frontline-plugin.tar.gz | docker load
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: frontline-plugin:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # The plugin in web: core's released images plus the built image (e2e/stack.sh), in
  # Chromium with axe, split across three runners that each start their own stack.
  e2e:
    needs: build
    if: needs.build.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontline-image
      # Before setup: the script needs only docker, git and openssl.
      - name: Start core and the plugin in the background
        run: |
          {
            status=0
            { gunzip -c frontline-plugin.tar.gz | docker load && bash e2e/stack.sh up; } > "$RUNNER_TEMP/stack.log" 2>&1 || status=$?
            echo "$status" > "$RUNNER_TEMP/stack.status"
          } &
      - uses: ./.github/actions/setup
      - name: Playwright's version, which keys the browser cache
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The runner image ships Chrome, so its system libraries are there; apt took up to 3 minutes.
      - name: Chromium (headless shell)
        run: pnpm exec playwright install --only-shell chromium
      - name: Wait for the stack
        run: |
          for _ in $(seq 150); do [ -f "$RUNNER_TEMP/stack.status" ] && break; sleep 2; done
          cat "$RUNNER_TEMP/stack.log"
          exit "$(cat "$RUNNER_TEMP/stack.status")"
      - name: Shard ${{ matrix.shard }} of the flows in light and every screen in light and dark
        run: pnpm e2e --shard=${{ matrix.shard }}/3 --workers=3 --reporter=github,list
      - name: Traces and screenshots of failed specs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-${{ matrix.shard }}
          path: e2e/test-results/
          retention-days: 14
      - name: Stack logs
        if: failure()
        run: pnpm e2e:stack logs

  # The one status branch protection requires: green only when every job above passed or
  # was skipped. A job skips only when the build said it needn't run or the build failed.
  required:
    name: Check
    if: always()
    needs: [check, build, scan, e2e]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "A required job ended $result."; exit 1 ;;
            esac
          done

  # The image the build job made, once the scan and every e2e shard passed on it, as
  # docker.io/erxes/frontline-plugin.
  push:
    name: Push the image to Docker Hub
    needs: required
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontline-image
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag and push sha-<12 chars> and main
        run: |
          gunzip -c frontline-plugin.tar.gz | docker load
          image=docker.io/erxes/frontline-plugin
          for tag in "sha-${GITHUB_SHA::12}" main; do
            docker tag frontline-plugin:ci "$image:$tag"
            docker push "$image:$tag"
          done
