<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Frontline</title>
    <!-- The call card (src/card.ts), in the colours of erxes's own softphone. -->
    <style>
      :root {
        --card: lab(100 0 0);
        --foreground: lab(8.3 0.6 -2.2);
        --muted: lab(44.3 1.8 0.7);
        --border: lab(90.6 0.4 -1.5);
        --secondary: lab(96 0 0);
        --primary: lab(39.9 40.5 -80.1);
        --destructive: lab(48 70 50);
        font-family: Inter, system-ui, sans-serif;
        font-size: 13px;
        color: var(--foreground);
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --card: lab(12 0 0);
          --foreground: lab(96 0 0);
          --muted: lab(66 0 0);
          --border: lab(24 0 0);
          --secondary: lab(20 0 0);
          --primary: lab(50 38 -78);
        }
      }
      * {
        box-sizing: border-box;
      }
      /* The window is clear (src/card.ts), so the card draws its own rounded face, and its
         shadow in the window's 12px margin. */
      html {
        background: transparent;
      }
      body {
        margin: 12px;
        height: calc(100vh - 24px);
        box-shadow:
          0 2px 4px lab(0 0 0 / 0.12),
          0 6px 12px lab(0 0 0 / 0.12);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
        overflow: hidden;
        /* The card moves by its face; its buttons still click. */
        -webkit-app-region: drag;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      #avatar {
        flex: none;
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        font-weight: 600;
        color: var(--primary);
        background: color-mix(in lab, var(--primary) 12%, transparent);
      }
      /* A ringing call pulses out of the avatar with each tone: one second of three. */
      .ringing #avatar {
        animation: ring 3s ease-out infinite;
      }
      .ringing #detail {
        color: var(--primary);
        font-weight: 500;
      }
      @keyframes ring {
        from {
          box-shadow: 0 0 0 0 color-mix(in lab, var(--primary) 45%, transparent);
        }
        33%,
        to {
          box-shadow: 0 0 0 10px transparent;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ringing #avatar {
          animation: none;
        }
      }
      .who {
        min-width: 0;
        flex: 1;
      }
      #name,
      #detail {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-variant-numeric: tabular-nums;
      }
      #name {
        font-size: 15px;
        font-weight: 600;
      }
      #detail {
        color: var(--muted);
      }
      #buttons {
        display: flex;
        gap: 6px;
      }
      button {
        flex: 1;
        min-width: 0;
        height: 32px;
        padding: 0 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font: inherit;
        font-weight: 500;
        color: var(--foreground);
        border: 0;
        border-radius: 6px;
        background: var(--secondary);
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      button span {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      button svg {
        flex: none;
        width: 15px;
        height: 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* On a call, Mute, Hold and Open are icons with their word as the tooltip and label. */
      button.icon {
        flex: 0 0 40px;
        padding: 0;
      }
      button.icon span {
        display: none;
      }
      button:hover {
        filter: brightness(0.95);
      }
      button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      button[aria-pressed='true'],
      button.go {
        color: white;
        background: var(--primary);
      }
      button.stop {
        color: white;
        background: var(--destructive);
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <div id="avatar" aria-hidden="true"></div>
      <div class="who">
        <div id="name"></div>
        <div id="detail" role="status"></div>
      </div>
    </header>
    <!-- Lucide's phone, phone-off, mic-off, pause and external-link. -->
    <div id="buttons">
      <button data-command="answer" class="go">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
          />
        </svg>
        <span></span>
      </button>
      <button data-command="mute" class="icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2 2l20 20M18.89 13.23A7.12 7.12 0 0 0 19 12v-2M5 10v2a7 7 0 0 0 12 5" />
          <path d="M15 9.34V5a3 3 0 0 0-5.68-1.33M9 9v3a3 3 0 0 0 5.12 2.12M12 19v3" />
        </svg>
        <span></span>
      </button>
      <button data-command="hold" class="icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="14" y="4" width="4" height="16" rx="1" />
          <rect x="6" y="4" width="4" height="16" rx="1" />
        </svg>
        <span></span>
      </button>
      <button data-command="open" class="icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
        </svg>
        <span></span>
      </button>
      <button data-command="hangUp" class="stop">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91M22 2 2 22"
          />
        </svg>
        <span></span>
      </button>
    </div>
    <script>
      const RING_HZ = 440;
      const RING_MS = 1000;
      const PAUSE_MS = 2000;
      const at = (id) => document.getElementById(id);
      const button = (command) => document.querySelector(`[data-command="${command}"]`);

      /** A button's word, shown beside its icon, or as its tooltip where only the icon shows. */
      const label = (command, word) => {
        const target = button(command);

        target.querySelector('span').textContent = word;
        target.title = word;
        target.setAttribute('aria-label', word);
      };

      let state = null;
      let stopTone = null;

      /** One second of tone, two of silence, until stopped. */
      const startTone = () => {
        const context = new AudioContext();
        const gain = context.createGain();
        const tone = context.createOscillator();

        const beep = () => {
          gain.gain.setValueAtTime(0.2, context.currentTime);
          gain.gain.setValueAtTime(0, context.currentTime + RING_MS / 1000);
        };

        tone.frequency.value = RING_HZ;
        gain.gain.value = 0;
        tone.connect(gain).connect(context.destination);
        tone.start();
        beep();

        const repeat = setInterval(beep, RING_MS + PAUSE_MS);

        return () => {
          clearInterval(repeat);
          void context.close();
        };
      };

      const clock = (since) => {
        const seconds = Math.max(0, Math.round((Date.now() - since) / 1000));
        const pad = (value) => String(value).padStart(2, '0');
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);

        return hours > 0
          ? `${hours}:${pad(minutes)}:${pad(seconds % 60)}`
          : `${minutes}:${pad(seconds % 60)}`;
      };

      /** Up to two initials of the name; a phone for a caller core has no name for. */
      const initials = (name) =>
        name
          ? name
              .split(/\s+/)
              .filter(Boolean)
              .slice(0, 2)
              .map((word) => word.charAt(0))
              .join('')
          : '\u260E';

      const draw = () => {
        if (!state) return;

        const { call, text } = state;
        const ringing = call.direction === 'incoming' && !call.talking;
        const doing = ringing ? text.incoming : call.talking ? clock(call.since) : text.calling;

        document.documentElement.lang = text.answer === 'Answer' ? 'en' : 'mn';
        document.body.classList.toggle('ringing', ringing);
        at('avatar').textContent = initials(call.name);
        at('name').textContent = call.name ?? call.number;
        at('detail').textContent = call.name ? `${call.number} · ${doing}` : doing;

        button('answer').hidden = !ringing;
        button('mute').hidden = !call.talking;
        button('hold').hidden = !call.talking;
        button('open').hidden = ringing;
        label('answer', text.answer);
        label('mute', text.mute);
        label('hold', text.hold);
        label('open', text.openCall);
        label('hangUp', ringing ? text.decline : text.hangUp);
        button('mute').setAttribute('aria-pressed', String(call.muted));
        button('hold').setAttribute('aria-pressed', String(call.held));
      };

      window.erxesCard.onState((next) => {
        const rings = Boolean(next && next.call.direction === 'incoming' && !next.call.talking);

        state = next;

        if (rings && !stopTone) stopTone = startTone();

        if (!rings && stopTone) {
          stopTone();
          stopTone = null;
        }

        draw();
      });

      // The call's length, as it grows.
      setInterval(draw, 1000);

      at('buttons').addEventListener('click', (event) => {
        const command = event.target.closest('button')?.dataset.command;

        if (command) window.erxesCard.send(command);
      });
    </script>
  </body>
</html>
