# erxes core's plugin CI runs the static checks, the tests on Postgres and the image with its
# vulnerability scan. This file adds what only frontline has: the size budgets, and the daily
# flows on core's released images (e2e/stack.sh) split across three runners. `Check` is the one
# status branch protection requires.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled: the budget-increase label reruns the budget check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The merge queue tests each pull request on top of main and the ones queued ahead of it. It
  # skips the e2e, which the pull request's own run already passed: a queue run catches what two
  # pull requests break together in types and tests, in minutes.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: erxes/erxes/.github/workflows/plugin-ci.yml@ci/reusable-plugin-workflow
    secrets: inherit

  # This change's sizes against its ceilings, and against the base branch built beside it.
  budgets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; the first parent is the base branch.
          fetch-depth: 2
      - uses: ./.github/actions/setup
      - name: Budgets
        env:
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'budget-increase') }}
        run: |
          pnpm build
          args=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
            (cd "$RUNNER_TEMP/base" && pnpm install --frozen-lockfile --prefer-offline && pnpm build)
            args+=(--base "$RUNNER_TEMP/base")
          fi
          [ "$LABELED" = true ] && args+=(--allow-increase)
          pnpm budgets "${args[@]}"

  # The plugin in web: core's released images plus this commit's image (e2e/stack.sh), in
  # Chromium with axe, split across three runners that each start their own stack.
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm image
        env:
          VERSION: ${{ github.sha }}
      - name: Start core and the plugin in the background
        run: |
          {
            status=0
            bash e2e/stack.sh up > "$RUNNER_TEMP/stack.log" 2>&1 || status=$?
            echo "$status" > "$RUNNER_TEMP/stack.status"
          } > /dev/null 2>&1 &
      - name: Playwright's version, which keys the browser cache
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The runner image ships Chrome, so its system libraries are there; apt took up to 3 minutes.
      - name: Chromium (headless shell)
        run: pnpm exec playwright install --only-shell chromium
      - name: Wait for the stack
        run: |
          for _ in $(seq 150); do [ -f "$RUNNER_TEMP/stack.status" ] && break; sleep 2; done
          cat "$RUNNER_TEMP/stack.log"
          exit "$(cat "$RUNNER_TEMP/stack.status")"
      - name: Shard ${{ matrix.shard }} of the flows in light and every screen in light and dark
        run: pnpm e2e --shard=${{ matrix.shard }}/3 --workers=3 --reporter=github,list
      - name: Traces and screenshots of failed specs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-${{ matrix.shard }}
          path: e2e/test-results/
          retention-days: 14
      - name: Stack logs
        if: failure()
        run: pnpm e2e:stack logs

  # The status branch protection requires: green when every job above passed, or skipped as
  # this file says (the e2e outside pull requests).
  check:
    name: Check
    needs: [ci, budgets, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "A required job ended $result."; exit 1 ;;
            esac
          done
