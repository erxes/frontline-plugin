packages:
  - api
  - ui
# `pnpm deploy` copies api/ with real files for the image.
injectWorkspacePackages: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
# Core publishes its packages under the v2-next tag, often more than once a day;
# the release-age gate stays on for everything else.
minimumReleaseAgeExclude:
  - '@erxes/*'
overrides:
  'vite@*': 'catalog:'
  # One copy, so drizzle-orm resolves once: react-doctor's Sentry asks for 1.9 and the
  # API's OpenTelemetry for 1.10, and two drizzle-orm copies don't share types.
  '@opentelemetry/api': 1.10.0
# Install scripts nothing here needs: esbuild ships its binary as an optional
# dependency, and the other two only print or check.
allowBuilds:
  core-js-pure: false
  esbuild: false
  protobufjs: false
