# `pnpm --filter @frontline/desktop dist` packages the app for the system it runs on, into release/.
# The Desktop workflow runs it on each system, and publishes a desktop-v<version> tag's installers.
appId: io.erxes.frontline
productName: Frontline
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - dist/**
  - package.json
# build.ts renders it from icons.ts.
icon: dist/icon.png
# The system offers the app for phone number links.
protocols:
  - name: Phone numbers
    schemes: [tel]
mac:
  # Apple silicon and Intel Macs.
  target:
    - target: dmg
      arch: [arm64, x64]
  # No Developer ID yet: an ad-hoc signature keeps the renamed bundle valid, so macOS offers
  # Open Anyway instead of calling it damaged. Ad-hoc signing can't load Electron's framework
  # under the hardened runtime.
  identity: '-'
  hardenedRuntime: false
  category: public.app-category.business
  extendInfo:
    NSMicrophoneUsageDescription: Frontline uses the microphone for your calls.
win:
  target: nsis
linux:
  target: AppImage
  executableName: frontline
  category: Network
