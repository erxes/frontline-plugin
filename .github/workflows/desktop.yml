name: Desktop

# Builds the desktop app's installers on macOS, Windows and Linux. A desktop-v<version> tag
# publishes them as a GitHub release; a pull request that changes desktop/ or what builds it, or
# a manual run, keeps them as the run's artifacts. They have no Developer ID or Windows
# certificate yet, so macOS and Windows warn on first open.
on:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths:
      - desktop/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .node-version
      - .github/actions/setup/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: The tag names desktop/package.json's version
        if: github.ref_type == 'tag'
        shell: bash
        run: test "$GITHUB_REF_NAME" = "desktop-v$(node -p "require('./desktop/package.json').version")"
      - run: pnpm --filter @frontline/desktop dist --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.AppImage
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      # A draft first, so a rerun after a failed upload finishes the same release.
      - name: Publish the installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --draft --title "Frontline desktop ${TAG#desktop-v}" --notes-file - <<'NOTES'
          The installers have no Developer ID or Windows certificate yet.

          - macOS: open the dmg and drag Frontline to Applications. The first time, macOS refuses to open it: go to System Settings, Privacy & Security, and pick Open Anyway. Or run `xattr -dr com.apple.quarantine /Applications/Frontline.app`.
          - Windows: when SmartScreen stops the installer, pick More info, then Run anyway.
          - Linux: `chmod +x` the AppImage and run it.
          NOTES
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false
